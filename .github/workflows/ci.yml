name: Pipeline with Build and Jest Test in 2 Jobs

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build app
        working-directory: frontend
        run: npm run build
        env:
          CI: "false"

      - name: Pack workspace as artifact
        run: tar -czf frontend-workspace.tar.gz frontend

      - name: Upload artifacts (node_modules and build)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-workspace
          path: frontend-workspace.tar.gz
          retention-days: 1

  tests:
    runs-on: ubuntu-22.04
    needs: build # Test-Job wartet, bis der Build-Job erfolgreich ist
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-workspace

      - name: Unpack workspace
        run: tar -xzf frontend-workspace.tar.gz

      - name: Run tests
        working-directory: frontend
        run: npm test
